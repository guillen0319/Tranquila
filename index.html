<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Un momento para ti</title>
<script>
  /* las escenas son nocturnas: se fuerza el tema oscuro antes de pintar, salvo que se haya elegido "Clásico" */
  try { if (localStorage.getItem("respira-fondo-2") !== "classic") document.documentElement.setAttribute("data-theme", "dark"); }
  catch(e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌧️</text></svg>" />
<style>
  /* registradas como <color> para que el cambio de fondo se anime suavemente */
  @property --bg-0{ syntax:'<color>'; inherits:true; initial-value:#131A22; }
  @property --bg-1{ syntax:'<color>'; inherits:true; initial-value:#1D2732; }
  @property --text-0{ syntax:'<color>'; inherits:true; initial-value:#EAF1F3; }
  @property --text-1{ syntax:'<color>'; inherits:true; initial-value:#94A5AE; }

  :root{
    color-scheme: dark;
    --bg-0:#131A22;
    --bg-1:#1D2732;
    --surface: rgba(255,255,255,0.05);
    --surface-strong: rgba(255,255,255,0.09);
    --text-0:#EAF1F3;
    --text-1:#94A5AE;
    --accent-rain:#6FAF95;
    --accent-piano:#CDA36B;
    --accent-violin:#C98B93;
    --accent: var(--accent-rain);
    --accent-glow: rgba(111,175,149,0.20);
    --accent-shadow: rgba(111,175,149,0.70);
    --serif: Iowan Old Style, Palatino Linotype, Palatino, Georgia, "Noto Serif", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --bg-0:#DDE4E6;
      --bg-1:#C9D3D6;
      --surface: rgba(15,25,30,0.05);
      --surface-strong: rgba(15,25,30,0.09);
      --text-0:#1E2A2F;
      --text-1:#546167;
      --accent-rain:#3D7A64;
      --accent-piano:#93692F;
      --accent-violin:#A55B66;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg-0:#131A22;
    --bg-1:#1D2732;
    --surface: rgba(255,255,255,0.05);
    --surface-strong: rgba(255,255,255,0.09);
    --text-0:#EAF1F3;
    --text-1:#94A5AE;
    --accent-rain:#6FAF95;
    --accent-piano:#CDA36B;
    --accent-violin:#C98B93;
    --accent-glow: rgba(111,175,149,0.20);
    --accent-shadow: rgba(111,175,149,0.70);
  }

  :root{ transition: --bg-0 2.2s ease, --bg-1 2.2s ease, --text-0 1.2s ease, --text-1 1.2s ease; }

  *{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg-0);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }

  body{
    font-family: var(--sans);
    color: var(--text-0);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--bg-1), var(--bg-0) 65%);
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow:hidden;
    transition: background 1s ease;
  }

  .scene{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    min-height: 100%;
  }

  .glow{
    position:absolute;
    width:min(70vw, 520px);
    height:min(70vw, 520px);
    border-radius:50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    filter: blur(10px);
    animation: breathe 7s ease-in-out infinite;
    transition: background 1.2s ease;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(0.94); opacity:.65; }
    50%{ transform: scale(1.08); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .glow{ animation:none; }
  }

  .top-controls{
    position:absolute;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 0 18px;
    z-index:3;
  }

  .pill-btn{
    font-family: var(--sans);
    font-size: 0.82rem;
    letter-spacing: .01em;
    color: var(--text-0);
    background: var(--surface);
    border: 1px solid var(--surface-strong);
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    backdrop-filter: blur(6px);
    transition: background .25s ease, transform .15s ease, border-color .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pill-btn:hover{ background: var(--surface-strong); }
  .pill-btn:active{ transform: scale(0.96); }
  .pill-btn:focus-visible, .cta:focus-visible, .icon-btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .right-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bg-label{
    position:absolute;
    top: calc(66px + env(safe-area-inset-top, 0px));
    right:18px;
    z-index:3;
    margin:0;
    font-size:.74rem;
    letter-spacing:.01em;
    color: var(--text-1);
    opacity:0;
    transform: translateY(-3px);
    transition: opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  .bg-label.show{ opacity:1; transform:none; }

  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border: 1px solid var(--surface-strong);
    background: var(--surface);
    color: var(--text-0);
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(6px);
  }
  .icon-btn:active{ transform: scale(0.94); }

  main.content{
    position:relative;
    z-index:2;
    max-width: 560px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap: 34px;
  }

  .phrase{
    margin:0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.5rem, 4.6vw, 2.35rem);
    line-height: 1.42;
    color: var(--text-0);
    max-width: 22ch;
    min-height: calc(1.42em * 3);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .9s ease, transform .9s ease, filter .9s ease;
  }
  /* sale: sube un poco y se desenfoca, como una exhalación */
  .phrase.is-leaving{
    opacity:0;
    transform: translateY(-8px);
    filter: blur(4px);
    transition-duration: .45s;
  }
  /* entra: viene desde abajo, desenfocada, y se enfoca despacio */
  .phrase.is-entering{
    opacity:0;
    transform: translateY(12px);
    filter: blur(5px);
    transition: none;
  }

  /* capa de fondo: dos manchas de color que derivan y cambian de matiz con cada frase */
  .backdrop{
    position:fixed;
    inset:-20%;
    z-index:0;
    pointer-events:none;
    background: var(--accent);
    opacity:.15;
    -webkit-mask-image:
      radial-gradient(38% 34% at 28% 32%, #000 0%, transparent 100%),
      radial-gradient(34% 32% at 74% 70%, #000 0%, transparent 100%);
    mask-image:
      radial-gradient(38% 34% at 28% 32%, #000 0%, transparent 100%),
      radial-gradient(34% 32% at 74% 70%, #000 0%, transparent 100%);
    transition: background-color 1.6s ease, filter 3.4s ease, transform 4s ease, opacity 1.2s ease;
    will-change: transform, filter;
  }

  /* escenas animadas (canvas) */
  .scene-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:0;
    transition: opacity .9s ease;
  }
  html.scene-on .backdrop{ opacity:0; }
  html.scene-on .phrase{ text-shadow: 0 2px 18px rgba(0,0,0,.5); }
  html.scene-on .hint,
  html.scene-on .bg-label{ text-shadow: 0 1px 10px rgba(0,0,0,.65); }

  /* ondas concéntricas, como una gota que cae en el agua */
  .ripple{
    position:absolute;
    top:50%; left:50%;
    z-index:1;
    width: min(64vw, 360px);
    aspect-ratio: 1;
    border-radius:50%;
    border: 1px solid var(--accent);
    pointer-events:none;
    opacity:0;
    transform: translate(-50%,-50%) scale(.3);
    animation: ripple 3s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes ripple{
    0%{ opacity:.5; transform: translate(-50%,-50%) scale(.3); }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(1.9); }
  }
  @media (prefers-reduced-motion: reduce){
    .ripple{ display:none; }
    .backdrop{ transition: background-color 1.6s ease, filter 3.4s ease; }
    .phrase, .phrase.is-leaving{ transform:none; filter:none; }
    .phrase.is-entering{ transform:none; filter:none; }
  }

  .cta{
    font-family: var(--sans);
    font-size: 0.95rem;
    color: var(--bg-0);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    cursor:pointer;
    box-shadow: 0 10px 30px -12px var(--accent-shadow);
    transition: background .5s ease, transform .15s ease, box-shadow .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:hover{ transform: translateY(-1px); }
  .cta:active{ transform: scale(0.97); }

  .hint{
    position:absolute;
    bottom: calc(46px + env(safe-area-inset-bottom, 0px));
    left:0; right:0;
    text-align:center;
    color: var(--text-1);
    font-size: 0.78rem;
    letter-spacing:.01em;
    z-index:2;
    padding: 0 20px;
  }

  .downloads{
    position:absolute;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap: 20px;
    z-index:2;
  }
  .link-btn{
    font-family: var(--sans);
    font-size: 0.74rem;
    color: var(--text-1);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
    cursor: pointer;
    padding: 4px 2px;
    transition: color .2s ease, text-decoration-color .2s ease;
  }
  .link-btn:hover{
    color: var(--text-0);
    text-decoration-color: currentColor;
  }
  .link-btn:disabled{
    opacity: .6;
    cursor: default;
  }

  .start-veil{
    position:fixed;
    inset:0;
    background: var(--bg-0);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    cursor:pointer;
    transition: opacity .6s ease;
  }
  .start-veil p{
    font-family: var(--serif);
    color: var(--text-0);
    font-size: 1.05rem;
    letter-spacing:.02em;
    opacity:.9;
  }
  .start-veil.hidden{
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

  <div class="start-veil" id="startVeil" role="button" tabindex="0" aria-label="Toca para comenzar">
    <p>Toca en cualquier lugar para comenzar 🌧️</p>
  </div>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <canvas class="scene-canvas" id="sceneCanvas" aria-hidden="true"></canvas>

  <div class="scene">
    <div class="glow" aria-hidden="true"></div>

    <div class="top-controls">
      <button class="pill-btn" id="soundToggle" type="button">🌧️ Lluvia</button>
      <div class="right-controls">
        <button class="icon-btn" id="bgToggle" type="button" aria-label="Cambiar fondo">🎨</button>
        <button class="icon-btn" id="muteToggle" type="button" aria-label="Silenciar sonido">🔊</button>
      </div>
    </div>
    <p class="bg-label" id="bgLabel" aria-live="polite"></p>

    <main class="content">
      <p class="phrase" id="phrase" aria-live="polite"></p>
      <button class="cta" id="newPhrase" type="button">Otra frase</button>
    </main>

    <p class="hint">Baja el volumen si quieres, cierra los ojos y respira despacio.</p>
  </div>

<script>
(function(){
  "use strict";

  // ---------- Frases ----------
  var phrases = [
    "No tienes que resolverlo todo hoy. Con este minuto es suficiente.",
    "Respira. Ya has llegado hasta aquí, y eso ya es mucho.",
    "Está bien parar. Descansar también es avanzar.",
    "Tu cuerpo sabe cómo calmarse, solo dale un momento.",
    "Lo que sientes es válido. Y también es pasajero.",
    "No estás atrasada en la vida, estás en tu propio momento.",
    "Suelta los hombros. Suelta la mandíbula. Suelta un poco más.",
    "Hiciste lo que pudiste con lo que tenías. Eso cuenta.",
    "Una cosa a la vez. Solo una.",
    "Puedes empezar de nuevo tantas veces como lo necesites.",
    "Este momento difícil no define lo que puedes lograr después.",
    "Te está permitido no tener todas las respuestas hoy.",
    "Cada respiración lenta es una pequeña victoria.",
    "No pasa nada por sentirte cansada. Descansa sin culpa.",
    "Eres más fuerte que muchos de tus días difíciles.",
    "El silencio también es un lugar donde puedes sanar.",
    "No compares tu ritmo con el de nadie más.",
    "Mereces la misma paciencia que le darías a alguien que quieres.",
    "Lo que hoy pesa, mañana pesará un poco menos.",
    "Estás permitiendo que tu mente descanse. Eso ya es cuidarte.",
    "No necesitas estar bien todo el tiempo para merecer calma.",
    "Poco a poco también se llega.",
    "Date permiso de no hacer nada por unos minutos.",
    "Vas a estar bien, aunque ahora no lo sientas así."
  ];

  var phraseEl = document.getElementById("phrase");
  var lastIndex = -1;

  function pickPhrase(){
    var i;
    do { i = Math.floor(Math.random() * phrases.length); }
    while (phrases.length > 1 && i === lastIndex);
    lastIndex = i;
    return phrases[i];
  }

  // ---------- Efectos: fondo que deriva + ondas ----------
  var scene = document.querySelector(".scene");
  var backdrop = document.getElementById("backdrop");
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  // el matiz solo se mueve un poco alrededor del color del modo, para que nunca choque
  var HUES = [-38, -20, 0, 20, 38];
  var lastHue = 0;

  function driftBackdrop(){
    var h;
    do { h = HUES[Math.floor(Math.random() * HUES.length)]; } while (h === lastHue);
    lastHue = h;
    backdrop.style.filter = "hue-rotate(" + h + "deg)";
    if (!reduceMotion){
      var dx = (Math.random() * 12 - 6).toFixed(1);
      var dy = (Math.random() * 12 - 6).toFixed(1);
      var sc = (1 + Math.random() * 0.12).toFixed(2);
      backdrop.style.transform = "translate(" + dx + "%," + dy + "%) scale(" + sc + ")";
    }
  }

  function ripple(){
    if (reduceMotion) return;
    [0, 450].forEach(function(delay){
      var r = document.createElement("span");
      r.className = "ripple";
      r.setAttribute("aria-hidden", "true");
      r.style.animationDelay = delay + "ms";
      r.addEventListener("animationend", function(){ r.remove(); });
      scene.appendChild(r);
    });
  }

  function bloom(){
    driftBackdrop();
    ripple();
    pulseScene();
  }

  // ---------- Escenas animadas ----------
  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function rgba(c, a){ return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")"; }

  // colores según el sonido: 3 para la aurora + 1 para las luciérnagas (r,g,b cada uno)
  var MODE_TINT = {
    rain:   [ 80,230,170,   70,170,230,  140,120,230,  190,255,130 ],
    piano:  [250,190, 90,  240,130, 90,  200,110,160,  255,200,110 ],
    violin: [240,130,170,  180,120,230,  110,150,240,  255,160,190 ]
  };
  var tint = { cur: MODE_TINT.rain.slice(), target: MODE_TINT.rain.slice() };
  function tintCol(i){ return [tint.cur[i * 3], tint.cur[i * 3 + 1], tint.cur[i * 3 + 2]]; }
  function setTintForMode(m){ if (MODE_TINT[m]) tint.target = MODE_TINT[m].slice(); }

  var sceneCanvas = document.getElementById("sceneCanvas");
  var sctx = sceneCanvas.getContext("2d");
  var sw = 0, sh = 0, activeScene = null, rafId = 0, lastT = 0, sceneTime = 0, energy = 0;
  var lastVw = 0, lastVh = 0;

  // ----- Aurora -----
  function sceneAurora(w, h){
    var bands = [
      { base: .30, amp: .07, f: .9,  sp:  .30, ph: 0, hgt: .34, a: .38, ci: 0 },
      { base: .37, amp: .09, f: 1.2, sp: -.22, ph: 2, hgt: .30, a: .30, ci: 1 },
      { base: .25, amp: .06, f: 1.6, sp:  .42, ph: 4, hgt: .26, a: .26, ci: 2 }
    ];
    var strips = bands.map(function(){
      var c = document.createElement("canvas");
      c.width = 1; c.height = 96;
      return { c: c, key: "" };
    });
    var stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * w, y: Math.random() * h * .7, a: rand(.15, .5), ph: rand(0, 6.28) });

    function buildStrip(strip, col){
      var key = (col[0] >> 3) + "," + (col[1] >> 3) + "," + (col[2] >> 3);
      if (strip.key === key) return;
      strip.key = key;
      var sg = strip.c.getContext("2d");
      sg.clearRect(0, 0, 1, 96);
      var gr = sg.createLinearGradient(0, 0, 0, 96);
      gr.addColorStop(0, rgba(col, 0));
      gr.addColorStop(.08, rgba(col, .85));
      gr.addColorStop(.35, rgba(col, .32));
      gr.addColorStop(1, rgba(col, 0));
      sg.fillStyle = gr;
      sg.fillRect(0, 0, 1, 96);
    }

    return {
      draw: function(g, dt, t){
        for (var i = 0; i < stars.length; i++){
          var s0 = stars[i];
          g.fillStyle = "rgba(220,230,255," + (s0.a * (.6 + .4 * Math.sin(t * .8 + s0.ph))) + ")";
          g.fillRect(s0.x, s0.y, 1, 1);
        }
        g.globalCompositeOperation = "lighter";
        var boost = 1 + .7 * energy;
        for (var bi = 0; bi < bands.length; bi++){
          var b = bands[bi];
          buildStrip(strips[bi], tintCol(b.ci));
          for (var x = 0; x < w; x++){
            var u = x / w;
            var y = h * (b.base + b.amp * Math.sin(u * 6.283 * b.f + t * b.sp + b.ph)
                                 + b.amp * .5 * Math.sin(u * 6.283 * b.f * 2.3 - t * b.sp * 1.3));
            var hh = h * b.hgt * (.8 + .4 * Math.sin(u * 6.283 * 3 + t * .5 + bi));
            var streak = .55 + .45 * Math.sin(u * 6.283 * (14 + bi * 5) + t * (.9 + bi * .2) + bi * 2);
            g.globalAlpha = Math.min(1, b.a * streak * boost);
            g.drawImage(strips[bi].c, 0, 0, 1, 96, x, y, 1, hh);
          }
        }
        g.globalAlpha = 1;
        g.globalCompositeOperation = "source-over";
      }
    };
  }

  // ----- Estrellas -----
  function sceneStars(w, h, res){
    var n = clamp(Math.round((w / res) * (h / res) / 1900), 90, 380);
    var stars = [];
    for (var i = 0; i < n; i++){
      var big = Math.random() < .07;
      stars.push({
        x: rand(0, w), y: rand(0, h),
        r: (big ? rand(1.2, 2) : rand(.4, 1.1)) * res,
        a: rand(.35, 1) * (big ? 1 : .8),
        sp: rand(.4, 1.6), ph: rand(0, 6.28), big: big
      });
    }
    var shoots = [];
    var next = rand(3, 6);
    function spawn(){
      if (shoots.length >= 2) return;
      var dir = Math.random() < .5 ? 1 : -1;
      var ang = rand(.35, .6);
      shoots.push({
        x: rand(.15, .85) * w, y: rand(0, .35) * h,
        vx: dir * Math.cos(ang), vy: Math.sin(ang),
        sp: w * rand(.9, 1.3), life: 0, dur: rand(.8, 1.2), len: w * rand(.16, .26)
      });
    }
    return {
      pulse: spawn,
      draw: function(g, dt, t){
        var col = [225 + (tint.cur[0] - 225) * .22, 232 + (tint.cur[1] - 232) * .22, 255 + (tint.cur[2] - 255) * .22];
        for (var i = 0; i < stars.length; i++){
          var s0 = stars[i];
          var a = clamp(s0.a * (.55 + .45 * Math.sin(t * s0.sp + s0.ph)) * (1 + .8 * energy), 0, 1);
          if (s0.big){
            var gr = g.createRadialGradient(s0.x, s0.y, 0, s0.x, s0.y, s0.r * 6);
            gr.addColorStop(0, rgba(col, a * .35));
            gr.addColorStop(1, rgba(col, 0));
            g.fillStyle = gr;
            g.fillRect(s0.x - s0.r * 6, s0.y - s0.r * 6, s0.r * 12, s0.r * 12);
          }
          g.fillStyle = rgba(col, a);
          g.beginPath();
          g.arc(s0.x, s0.y, s0.r, 0, 6.283);
          g.fill();
        }
        next -= dt;
        if (next <= 0){ spawn(); next = rand(8, 15); }
        g.lineCap = "round";
        for (var j = shoots.length - 1; j >= 0; j--){
          var sh0 = shoots[j];
          sh0.life += dt;
          var p = sh0.life / sh0.dur;
          if (p >= 1){ shoots.splice(j, 1); continue; }
          sh0.x += sh0.vx * sh0.sp * dt;
          sh0.y += sh0.vy * sh0.sp * dt;
          var fade = Math.sin(p * Math.PI);
          var tx = sh0.x - sh0.vx * sh0.len, ty = sh0.y - sh0.vy * sh0.len;
          var lg = g.createLinearGradient(sh0.x, sh0.y, tx, ty);
          lg.addColorStop(0, "rgba(255,255,255," + (.9 * fade) + ")");
          lg.addColorStop(1, "rgba(255,255,255,0)");
          g.strokeStyle = lg;
          g.lineWidth = 1.6 * res;
          g.beginPath();
          g.moveTo(sh0.x, sh0.y);
          g.lineTo(tx, ty);
          g.stroke();
        }
      }
    };
  }

  // ----- Lluvia sobre el vidrio -----
  function sceneRain(w, h, res){
    var u = Math.min(w, h);
    var lightCols = [[255,190,110],[255,150,120],[150,200,255],[255,225,170],[190,160,255]];
    var lights = [];
    for (var i = 0; i < 14; i++){
      lights.push({ x: rand(0, w), y: rand(.5, .95) * h, r: rand(.05, .11) * u, c: lightCols[i % 5],
                    a: rand(.12, .24), sp: rand(.3, .8), ph: rand(0, 6.28) });
    }
    var n = clamp(Math.round((w / res) * (h / res) / 5200), 40, 200);
    function newDrop(init){
      var near = Math.random() < .35;
      return {
        x: rand(-.1 * w, 1.1 * w),
        y: init ? rand(-h, h) : rand(-.3 * h, 0),
        len: (near ? rand(.05, .09) : rand(.025, .05)) * h,
        v: (near ? rand(1.0, 1.5) : rand(.6, .95)) * h,
        a: near ? rand(.16, .32) : rand(.07, .16),
        lw: (near ? 1.3 : .8) * res
      };
    }
    var drops = [];
    for (var d = 0; d < n; d++) drops.push(newDrop(true));
    var beads = [];
    var m = clamp(Math.round(n / 8), 8, 22);
    for (var k = 0; k < m; k++){
      beads.push({ x: rand(.05, .95) * w, y: rand(.05, .8) * h, r: rand(1.6, 3.6) * res,
                   vy: 0, moving: false, timer: rand(0, 3), run: 0 });
    }
    return {
      draw: function(g, dt, t){
        for (var i = 0; i < lights.length; i++){
          var L = lights[i];
          var a = L.a * (.7 + .3 * Math.sin(t * L.sp + L.ph));
          var gr = g.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
          gr.addColorStop(0, rgba(L.c, a));
          gr.addColorStop(.6, rgba(L.c, a * .45));
          gr.addColorStop(1, rgba(L.c, 0));
          g.fillStyle = gr;
          g.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
        }
        var speed = 1 + 1.3 * energy;
        g.lineCap = "round";
        for (var j = 0; j < drops.length; j++){
          var dr = drops[j];
          dr.y += dr.v * speed * dt;
          dr.x += dr.v * speed * dt * .16;
          if (dr.y - dr.len > h){ drops[j] = newDrop(false); continue; }
          g.strokeStyle = "rgba(190,212,238," + (dr.a * (1 + .5 * energy)) + ")";
          g.lineWidth = dr.lw;
          g.beginPath();
          g.moveTo(dr.x, dr.y);
          g.lineTo(dr.x - dr.len * .16, dr.y - dr.len);
          g.stroke();
        }
        for (var q = 0; q < beads.length; q++){
          var b = beads[q];
          b.timer -= dt;
          if (b.moving){
            b.vy = Math.min(b.vy + h * .25 * dt, h * .16);
            b.y += b.vy * dt;
            b.run = Math.min(b.run + b.vy * dt, h * .12);
            if (b.timer <= 0){ b.moving = false; b.vy = 0; b.timer = rand(1.5, 5); }
          } else {
            b.run = Math.max(0, b.run - h * .03 * dt);
            if (b.timer <= 0){ b.moving = true; b.timer = rand(.7, 2); }
          }
          if (b.y > h + 10){
            b.y = rand(-.05, .15) * h; b.x = rand(.05, .95) * w;
            b.run = 0; b.moving = false; b.timer = rand(.5, 3);
          }
          if (b.run > 1){
            var tg = g.createLinearGradient(0, b.y - b.run, 0, b.y);
            tg.addColorStop(0, "rgba(200,220,240,0)");
            tg.addColorStop(1, "rgba(200,220,240,.13)");
            g.strokeStyle = tg;
            g.lineWidth = b.r * .8;
            g.beginPath();
            g.moveTo(b.x, b.y - b.run);
            g.lineTo(b.x, b.y);
            g.stroke();
          }
          g.fillStyle = "rgba(205,225,245,.14)";
          g.beginPath();
          g.arc(b.x, b.y, b.r, 0, 6.283);
          g.fill();
          g.strokeStyle = "rgba(230,240,255,.22)";
          g.lineWidth = res * .7;
          g.stroke();
          g.fillStyle = "rgba(255,255,255,.45)";
          g.beginPath();
          g.arc(b.x - b.r * .32, b.y - b.r * .32, b.r * .3, 0, 6.283);
          g.fill();
        }
      }
    };
  }

  // ----- Luciérnagas -----
  function sceneFireflies(w, h, res){
    var n = clamp(Math.round((w / res) * (h / res) / 14000), 16, 46);
    var flies = [];
    for (var i = 0; i < n; i++){
      flies.push({
        bx: rand(0, w), by: rand(.25, .92) * h,
        vx: rand(-5, 5) * res, vy: rand(-6, 2) * res, kx: 0, ky: 0,
        ax: rand(10, 30) * res, ay: rand(8, 22) * res,
        f1: rand(.15, .4), f2: rand(.3, .7),
        p1: rand(0, 6.28), p2: rand(0, 6.28), p3: rand(0, 6.28), p4: rand(0, 6.28),
        r: rand(1.6, 3) * res, cyc: rand(3.5, 7), ph: rand(0, 6.28)
      });
    }
    function far(x){ var uu = x / w; return h * (.84 + .03 * Math.sin(uu * 3.6 + .3) + .02 * Math.sin(uu * 8.1 + 2)); }
    function near(x){ var uu = x / w; return h * (.90 + .025 * Math.sin(uu * 5.2 + 1.1) + .015 * Math.sin(uu * 12.7)); }
    var blades = [];
    for (var x = 0; x < w; x += 9 * res) blades.push({ x: x + rand(-3, 3), h: rand(8, 20) * res, ph: rand(0, 6.28) });

    function hill(g, fn, color){
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(0, h);
      for (var x = 0; x <= w + 6; x += 6) g.lineTo(x, fn(x));
      g.lineTo(w, h);
      g.closePath();
      g.fill();
    }

    return {
      pulse: function(){
        for (var i = 0; i < flies.length; i++){
          flies[i].kx += rand(-14, 14) * res;
          flies[i].ky += rand(-12, 4) * res;
        }
      },
      draw: function(g, dt, t){
        hill(g, far, "#07130E");
        var c = tintCol(3);
        g.globalCompositeOperation = "lighter";
        for (var i = 0; i < flies.length; i++){
          var f = flies[i];
          f.bx += (f.vx + f.kx) * dt;
          f.by += (f.vy + f.ky) * dt;
          var decay = Math.exp(-dt * .6);
          f.kx *= decay; f.ky *= decay;
          if (f.bx < -40) f.bx = w + 40;
          if (f.bx > w + 40) f.bx = -40;
          if (f.by < h * .2) f.by = h * .92;
          if (f.by > h * .95) f.by = h * .3;
          var x = f.bx + f.ax * Math.sin(t * f.f1 + f.p1) + f.ax * .5 * Math.sin(t * f.f2 + f.p2);
          var y = f.by + f.ay * Math.sin(t * f.f1 * 1.1 + f.p3) + f.ay * .5 * Math.sin(t * f.f2 * .9 + f.p4);
          var sn = Math.sin(t * 6.283 / f.cyc + f.ph);
          var bl = sn > 0 ? Math.pow(sn, 2.2) : 0;
          var a = clamp((.10 + .9 * bl) * (1 + .8 * energy), 0, 1);
          var R = f.r * (5 + 3 * bl) * (1 + .5 * energy);
          var gr = g.createRadialGradient(x, y, 0, x, y, R);
          gr.addColorStop(0, rgba(c, a * .9));
          gr.addColorStop(.3, rgba(c, a * .35));
          gr.addColorStop(1, rgba(c, 0));
          g.fillStyle = gr;
          g.fillRect(x - R, y - R, R * 2, R * 2);
          g.fillStyle = "rgba(255,255,230," + a + ")";
          g.beginPath();
          g.arc(x, y, f.r * .55, 0, 6.283);
          g.fill();
        }
        g.globalCompositeOperation = "source-over";
        hill(g, near, "#03080A");
        g.strokeStyle = "#03080A";
        g.lineWidth = 1.3 * res;
        g.lineCap = "round";
        g.beginPath();
        for (var k = 0; k < blades.length; k++){
          var bl2 = blades[k];
          var yb = near(bl2.x) + 1;
          var sway = Math.sin(t * .8 + bl2.x * .05 + bl2.ph) * 3 * res;
          g.moveTo(bl2.x, yb);
          g.quadraticCurveTo(bl2.x, yb - bl2.h * .6, bl2.x + sway, yb - bl2.h);
        }
        g.stroke();
      }
    };
  }

  // ----- Atardecer -----
  function sceneSunset(w, h, res){
    var u = Math.min(w, h);
    var clouds = [];
    for (var i = 0; i < 6; i++){
      clouds.push({ x: rand(-.2, 1.1) * w, y: rand(.16, .62) * h, wd: rand(.4, .8) * w, ht: rand(.05, .095) * h,
                    v: rand(3, 9) * res, a: rand(.07, .15) });
    }
    var nm = clamp(Math.round((w / res) * (h / res) / 9000), 20, 60);
    var motes = [];
    for (var m = 0; m < nm; m++){
      motes.push({ x: rand(0, w), y: rand(.3, 1) * h, r: rand(.8, 2.4) * res, vy: rand(3, 10) * res,
                   a: rand(.15, .5), ph: rand(0, 6.28) });
    }
    function farY(x){ var uu = x / w; return h * (.84 + .022 * Math.sin(uu * 4.2 + .6) + .012 * Math.sin(uu * 11.3)); }
    function nearY(x){ var uu = x / w; return h * (.915 + .02 * Math.sin(uu * 3 + 2.2) + .01 * Math.sin(uu * 9)); }
    function hill(g, fn, color){
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(0, h);
      for (var x = 0; x <= w + 6; x += 6) g.lineTo(x, fn(x));
      g.lineTo(w, h);
      g.closePath();
      g.fill();
    }
    return {
      draw: function(g, dt, t){
        var sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#0F0B22");
        sky.addColorStop(.42, "#2A1638");
        sky.addColorStop(.66, "#6E2C4B");
        sky.addColorStop(.80, "#C9603F");
        sky.addColorStop(1, "#2A1226");
        g.fillStyle = sky;
        g.fillRect(0, 0, w, h);

        var sunY = h * .79 + h * .006 * Math.sin(t * .45);
        var R = h * .6 * (1 + .2 * energy);
        var glow = g.createRadialGradient(w / 2, sunY, 0, w / 2, sunY, R);
        glow.addColorStop(0, "rgba(255,170,100," + (.55 + .15 * energy) + ")");
        glow.addColorStop(.3, "rgba(240,110,90,.28)");
        glow.addColorStop(.65, "rgba(160,60,100,.10)");
        glow.addColorStop(1, "rgba(120,40,100,0)");
        g.fillStyle = glow;
        g.fillRect(0, 0, w, h);

        var sr = u * .10;
        var disc = g.createRadialGradient(w / 2, sunY, 0, w / 2, sunY, sr);
        disc.addColorStop(0, "#FFF0C8");
        disc.addColorStop(.75, "#FFC27A");
        disc.addColorStop(1, "rgba(255,160,100,0)");
        g.fillStyle = disc;
        g.beginPath();
        g.arc(w / 2, sunY, sr, 0, 6.283);
        g.fill();

        for (var i = 0; i < clouds.length; i++){
          var c = clouds[i];
          c.x += c.v * dt;
          if (c.x - c.wd / 2 > w) c.x = -c.wd / 2;
          var col = c.y > h * .4 ? [255, 150, 120] : [190, 150, 220];
          var a = c.a * (1 + .5 * energy);
          for (var lump = -1; lump <= 1; lump++){
            var cw = c.wd * (lump === 0 ? 1 : .6) / 2;
            g.save();
            g.translate(c.x + lump * c.wd * .22, c.y + (lump === 0 ? 0 : -c.ht * .15));
            g.scale(1, c.ht / c.wd);
            var cg = g.createRadialGradient(0, 0, 0, 0, 0, cw);
            cg.addColorStop(0, rgba(col, a));
            cg.addColorStop(1, rgba(col, 0));
            g.fillStyle = cg;
            g.beginPath();
            g.arc(0, 0, cw, 0, 6.283);
            g.fill();
            g.restore();
          }
        }

        hill(g, farY, "#3E1D3D");
        g.strokeStyle = "rgba(255,170,120,.22)";
        g.lineWidth = 1.2 * res;
        g.beginPath();
        for (var x = 0; x <= w + 6; x += 6){ if (x === 0) g.moveTo(x, farY(x)); else g.lineTo(x, farY(x)); }
        g.stroke();
        hill(g, nearY, "#150A1E");

        g.globalCompositeOperation = "lighter";
        for (var k = 0; k < motes.length; k++){
          var mo = motes[k];
          mo.y -= mo.vy * dt;
          if (mo.y < -5){ mo.y = h + 5; mo.x = rand(0, w); }
          g.fillStyle = "rgba(255,214,160," + (mo.a * (.5 + .5 * Math.sin(t * 1.2 + mo.ph))) + ")";
          g.beginPath();
          g.arc(mo.x, mo.y, mo.r, 0, 6.283);
          g.fill();
        }
        g.globalCompositeOperation = "source-over";
      }
    };
  }

  // ----- Motor de escenas -----
  function hiRes(vw, dpr){ return Math.min(dpr || 1, 1.5); }
  var SCENES = [
    { id: "aurora",    name: "Aurora",      pal: ["#070B16", "#12203A"], build: sceneAurora,    res: function(vw){ return Math.min(.5, 360 / vw); } },
    { id: "stars",     name: "Estrellas",   pal: ["#050812", "#141C36"], build: sceneStars,     res: hiRes },
    { id: "rain",      name: "Lluvia",      pal: ["#0A1118", "#1B2A38"], build: sceneRain,      res: hiRes },
    { id: "fireflies", name: "Luciérnagas", pal: ["#060F0C", "#132A20"], build: sceneFireflies, res: hiRes },
    { id: "sunset",    name: "Atardecer",   pal: ["#150F26", "#3A1C3F"], build: sceneSunset,    res: function(){ return .5; } },
    { id: "classic",   name: "Clásico",     classic: true, dark: ["#131A22", "#1D2732"], light: ["#DDE4E6", "#C9D3D6"] }
  ];
  var BG_KEY = "respira-fondo-2";
  var bgIndex = 0;
  var bgLabel = document.getElementById("bgLabel");
  var bgButton = document.getElementById("bgToggle");
  var bgLabelTimer = null;
  var switchTimer = null;
  var resizeTimer = null;
  var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function isDarkTheme(){
    var forced = document.documentElement.getAttribute("data-theme");
    if (forced === "dark") return true;
    if (forced === "light") return false;
    return darkQuery ? darkQuery.matches : true;
  }

  // paleta de fondo + tema (las escenas siempre son oscuras; "Clásico" sigue al dispositivo)
  function applyBackground(){
    var cfg = SCENES[bgIndex];
    var rootEl = document.documentElement;
    if (cfg.classic) rootEl.removeAttribute("data-theme");
    else rootEl.setAttribute("data-theme", "dark");
    var c = cfg.classic ? (isDarkTheme() ? cfg.dark : cfg.light) : cfg.pal;
    rootEl.style.setProperty("--bg-0", c[0]);
    rootEl.style.setProperty("--bg-1", c[1]);
    bgButton.setAttribute("aria-label", "Cambiar fondo (actual: " + cfg.name + ")");
  }

  function drawFrame(dt){
    sceneTime += dt;
    energy = Math.max(0, energy - dt / 2.4);
    var k = 1 - Math.exp(-dt * 1.6);
    for (var i = 0; i < 12; i++) tint.cur[i] += (tint.target[i] - tint.cur[i]) * k;
    sctx.globalCompositeOperation = "source-over";
    sctx.globalAlpha = 1;
    sctx.clearRect(0, 0, sw, sh);
    activeScene.draw(sctx, dt, sceneTime);
  }

  function loop(now){
    rafId = requestAnimationFrame(loop);
    var dt = lastT ? Math.min(.05, (now - lastT) / 1000) : .016;
    lastT = now;
    drawFrame(dt);
  }

  function startScene(){
    var def = SCENES[bgIndex];
    document.documentElement.classList.toggle("scene-on", !def.classic);
    if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    if (def.classic){
      activeScene = null;
      sceneCanvas.style.opacity = "0";
      return;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var res = def.res(vw, window.devicePixelRatio || 1);
    sw = Math.max(2, Math.round(vw * res));
    sh = Math.max(2, Math.round(vh * res));
    sceneCanvas.width = sw;
    sceneCanvas.height = sh;
    lastVw = vw; lastVh = vh;
    sceneTime = reduceMotion ? 4 : 0;
    activeScene = def.build(sw, sh, res);
    sceneCanvas.style.opacity = "1";
    if (reduceMotion){ drawFrame(.016); return; }
    lastT = 0;
    rafId = requestAnimationFrame(loop);
  }

  function pulseScene(){
    if (!activeScene || reduceMotion) return;
    energy = 1;
    if (activeScene.pulse) activeScene.pulse();
  }

  function showBgLabel(text){
    bgLabel.textContent = text;
    bgLabel.classList.add("show");
    if (bgLabelTimer) clearTimeout(bgLabelTimer);
    bgLabelTimer = setTimeout(function(){ bgLabel.classList.remove("show"); }, 1800);
  }

  bgButton.addEventListener("click", function(){
    bgIndex = (bgIndex + 1) % SCENES.length;
    applyBackground();
    showBgLabel(SCENES[bgIndex].name);
    try { localStorage.setItem(BG_KEY, SCENES[bgIndex].id); } catch(e) {}
    sceneCanvas.style.opacity = "0"; // fundido: sale la escena anterior y luego entra la nueva
    if (switchTimer) clearTimeout(switchTimer);
    switchTimer = setTimeout(startScene, reduceMotion ? 0 : 450);
  });

  window.addEventListener("resize", function(){
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (!activeScene) return;
      if (Math.abs(window.innerWidth - lastVw) > 2 || Math.abs(window.innerHeight - lastVh) > 80) startScene();
    }, 200);
  });

  // si el dispositivo cambia entre modo claro y oscuro, "Clásico" se ajusta
  if (darkQuery){
    var onSchemeChange = function(){ applyBackground(); };
    if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSchemeChange);
    else if (darkQuery.addListener) darkQuery.addListener(onSchemeChange);
  }

  // arranque: recuerda el último fondo (por defecto, Aurora), sin animar el cambio de paleta
  (function restoreBackground(){
    var saved = null;
    try { saved = localStorage.getItem(BG_KEY); } catch(e) {}
    for (var i = 0; i < SCENES.length; i++){ if (SCENES[i].id === saved) bgIndex = i; }
    var rootEl = document.documentElement;
    rootEl.style.transition = "none";
    applyBackground();
    void rootEl.offsetWidth;
    rootEl.style.transition = "";
    startScene();
  })();

  var changing = false;
  function showNewPhrase(){
    if (changing) return;
    changing = true;
    bloom();
    phraseEl.classList.add("is-leaving");
    setTimeout(function(){
      phraseEl.textContent = pickPhrase();
      phraseEl.classList.remove("is-leaving");
      phraseEl.classList.add("is-entering");
      void phraseEl.offsetWidth; // fuerza el reflow para que arranque la transición de entrada
      phraseEl.classList.remove("is-entering");
      changing = false;
    }, 450);
  }

  phraseEl.textContent = pickPhrase();

  document.getElementById("newPhrase").addEventListener("click", showNewPhrase);

  var ctx = null;
  var master = null;
  var rain = null;
  var piano = null;
  var violin = null;
  var mode = "rain"; // "rain" | "piano"
  var muted = false;
  var started = false;

  function makeReverbBuffer(context){
    var length = context.sampleRate * 1.6;
    var buf = context.createBuffer(2, length, context.sampleRate);
    for (var ch = 0; ch < 2; ch++){
      var data = buf.getChannelData(ch);
      for (var i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
      }
    }
    return buf;
  }

  function makeBrownBuffer(context, seconds){
    var bufferSize = Math.floor(context.sampleRate * seconds);
    var buffer = context.createBuffer(1, bufferSize, context.sampleRate);
    var data = buffer.getChannelData(0);
    var last = 0;
    for (var i = 0; i < bufferSize; i++){
      var white = Math.random() * 2 - 1;
      last = (last + 0.018 * white) / 1.018;
      data[i] = last * 3.6;
    }
    return buffer;
  }

  function makeWhiteBuffer(context, seconds){
    var bufferSize = Math.floor(context.sampleRate * seconds);
    var buffer = context.createBuffer(1, bufferSize, context.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function buildRain(context, destination){
    var brownBuffer = makeBrownBuffer(context, 6);
    var whiteBuffer = makeWhiteBuffer(context, 3);

    // cuerpo cálido y grave de la lluvia (sonido continuo tipo "shhh" suave)
    var body = context.createBufferSource();
    body.buffer = brownBuffer;
    body.loop = true;

    var bodyLowpass = context.createBiquadFilter();
    bodyLowpass.type = "lowpass";
    bodyLowpass.frequency.value = 1100;
    var bodyHighpass = context.createBiquadFilter();
    bodyHighpass.type = "highpass";
    bodyHighpass.frequency.value = 90;

    var lfo = context.createOscillator();
    lfo.frequency.value = 0.045;
    var lfoGain = context.createGain();
    lfoGain.gain.value = 180;
    lfo.connect(lfoGain).connect(bodyLowpass.frequency);

    var bodyGain = context.createGain();
    bodyGain.gain.value = 0.5;

    // fondo grave envolvente, casi imperceptible, da sensación de "manta"
    var underlay = context.createBufferSource();
    underlay.buffer = brownBuffer;
    underlay.loop = true;
    var underlayLowpass = context.createBiquadFilter();
    underlayLowpass.type = "lowpass";
    underlayLowpass.frequency.value = 220;
    var underlayGain = context.createGain();
    underlayGain.gain.value = 0.22;

    // capa muy sutil de "goteo" fino, apagada y lenta (nada de silbido agudo)
    var drops = context.createBufferSource();
    drops.buffer = whiteBuffer;
    drops.loop = true;
    var dropsBandpass = context.createBiquadFilter();
    dropsBandpass.type = "bandpass";
    dropsBandpass.frequency.value = 2600;
    dropsBandpass.Q.value = 0.7;
    var dropsLowpass = context.createBiquadFilter();
    dropsLowpass.type = "lowpass";
    dropsLowpass.frequency.value = 3200;
    var dropsGain = context.createGain();
    dropsGain.gain.value = 0.05;
    var lfo2 = context.createOscillator();
    lfo2.frequency.value = 0.11;
    var lfo2Gain = context.createGain();
    lfo2Gain.gain.value = 0.03;
    lfo2.connect(lfo2Gain).connect(dropsGain.gain);

    var gain = context.createGain();
    gain.gain.value = 0.6;

    body.connect(bodyHighpass).connect(bodyLowpass).connect(bodyGain).connect(gain);
    underlay.connect(underlayLowpass).connect(underlayGain).connect(gain);
    drops.connect(dropsBandpass).connect(dropsLowpass).connect(dropsGain).connect(gain);
    gain.connect(destination);

    body.start();
    underlay.start();
    drops.start();
    lfo.start();
    lfo2.start();

    return { gain: gain, level: 0.6, start: function(){}, stop: function(){} };
  }

  // escala de La menor (más melancólica y espaciosa), notas siempre consonantes entre sí
  var PIANO_SCALE = [220.0, 261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 659.25];
  var PAD_CHORDS = [
    [220.0, 261.63, 329.63],   // Am
    [174.61, 220.0, 261.63],   // F
    [196.0, 246.94, 329.63],   // G (con novena suave)
    [220.0, 261.63, 392.0]     // Am7-ish
  ];

  function pluckNote(context, freq, time, dest){
    var o1 = context.createOscillator();
    o1.type = "sine";
    o1.frequency.value = freq;
    var o2 = context.createOscillator();
    o2.type = "sine";
    o2.frequency.value = freq * 2;
    var g2 = context.createGain();
    g2.gain.value = 0.09;

    var env = context.createGain();
    env.gain.setValueAtTime(0.0001, time);
    env.gain.linearRampToValueAtTime(0.24, time + 0.06);
    env.gain.exponentialRampToValueAtTime(0.0001, time + 5.5);

    o1.connect(env);
    o2.connect(g2).connect(env);
    env.connect(dest);

    o1.start(time); o2.start(time);
    o1.stop(time + 5.6); o2.stop(time + 5.6);
  }

  // capa suave tipo cuerdas: acordes largos y sostenidos con ataque lento
  function stringSwell(context, freqs, time, duration, dest){
    freqs.forEach(function(freq){
      var osc = context.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = freq;
      var stringFilter = context.createBiquadFilter();
      stringFilter.type = "lowpass";
      stringFilter.frequency.value = 900;
      var env = context.createGain();
      env.gain.setValueAtTime(0.0001, time);
      env.gain.linearRampToValueAtTime(0.05, time + duration * 0.4);
      env.gain.linearRampToValueAtTime(0.0001, time + duration);
      osc.connect(stringFilter).connect(env).connect(dest);
      osc.start(time);
      osc.stop(time + duration + 0.2);
    });
  }

  // construye la cadena de reverb/calidez del piano; no la conecta a ningún destino final
  function createPianoAudioGraph(context){
    var reverb = context.createConvolver();
    reverb.buffer = makeReverbBuffer(context);
    var wet = context.createGain();
    wet.gain.value = 0.68;
    var warmth = context.createBiquadFilter();
    warmth.type = "lowpass";
    warmth.frequency.value = 2600;
    var out = context.createGain();
    out.gain.value = 0;

    // vaivén lento y genérico de intensidad: más presente por momentos, luego vuelve a lo íntimo
    var dynamicsLfo = context.createOscillator();
    dynamicsLfo.type = "sine";
    dynamicsLfo.frequency.value = 1 / 50; // un ciclo completo cada ~50s
    var dynamicsDepth = context.createGain();
    dynamicsDepth.gain.value = 0.12;
    var dynamicsBase = context.createConstantSource();
    dynamicsBase.offset.value = 0.7;
    dynamicsLfo.connect(dynamicsDepth);
    dynamicsDepth.connect(out.gain);
    dynamicsBase.connect(out.gain);
    dynamicsLfo.start();
    dynamicsBase.start();

    reverb.connect(wet).connect(warmth);
    var dry = context.createGain();
    dry.gain.value = 0.38;
    dry.connect(warmth);
    warmth.connect(out);

    return { dry: dry, reverb: reverb, out: out };
  }

  function buildPiano(context, destination){
    var graph = createPianoAudioGraph(context);
    var modeGain = context.createGain();
    modeGain.gain.value = 0;
    graph.out.connect(modeGain);
    modeGain.connect(destination);

    var timer = null;
    var padTimer = null;
    var active = false;

    function scheduleLoop(){
      if (!active) return;
      var now = context.currentTime;
      var note = PIANO_SCALE[Math.floor(Math.random() * PIANO_SCALE.length)];
      pluckNote(context, note, now + 0.05, graph.dry);
      pluckNote(context, note, now + 0.05, graph.reverb);
      if (Math.random() < 0.3){
        var harmony = PIANO_SCALE[Math.floor(Math.random() * PIANO_SCALE.length)];
        pluckNote(context, harmony, now + 2.2, graph.dry);
        pluckNote(context, harmony, now + 2.2, graph.reverb);
      }
      var nextIn = 4200 + Math.random() * 4200;
      timer = setTimeout(scheduleLoop, nextIn);
    }

    function schedulePad(){
      if (!active) return;
      var now = context.currentTime;
      var chord = PAD_CHORDS[Math.floor(Math.random() * PAD_CHORDS.length)];
      var duration = 9 + Math.random() * 4;
      stringSwell(context, chord, now + 0.1, duration, graph.reverb);
      stringSwell(context, chord, now + 0.1, duration, graph.dry);
      padTimer = setTimeout(schedulePad, duration * 1000 * 0.85);
    }

    return {
      gain: modeGain,
      level: 0.7,
      start: function(){
        if (active) return;
        active = true;
        scheduleLoop();
        schedulePad();
      },
      stop: function(){
        active = false;
        if (timer) clearTimeout(timer);
        if (padTimer) clearTimeout(padTimer);
      }
    };
  }

  // ---------- Renderizado fuera de tiempo real, para poder descargar el audio ----------

  function renderRainWav(durationSeconds){
    var sampleRate = 44100;
    var offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(durationSeconds * sampleRate), sampleRate);
    buildRain(offlineCtx, offlineCtx.destination);
    return offlineCtx.startRendering().then(audioBufferToWavBlob);
  }

  function renderPianoWav(durationSeconds){
    var sampleRate = 44100;
    var offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.ceil(durationSeconds * sampleRate), sampleRate);
    var graph = createPianoAudioGraph(offlineCtx);
    graph.out.connect(offlineCtx.destination);

    var t = 0.3;
    while (t < durationSeconds - 6){
      var note = PIANO_SCALE[Math.floor(Math.random() * PIANO_SCALE.length)];
      pluckNote(offlineCtx, note, t, graph.dry);
      pluckNote(offlineCtx, note, t, graph.reverb);
      if (Math.random() < 0.3){
        var harmony = PIANO_SCALE[Math.floor(Math.random() * PIANO_SCALE.length)];
        pluckNote(offlineCtx, harmony, t + 2.2, graph.dry);
        pluckNote(offlineCtx, harmony, t + 2.2, graph.reverb);
      }
      t += 4.2 + Math.random() * 4.2;
    }

    var t2 = 0.3;
    while (t2 < durationSeconds - 10){
      var chord = PAD_CHORDS[Math.floor(Math.random() * PAD_CHORDS.length)];
      var dur = 9 + Math.random() * 4;
      stringSwell(offlineCtx, chord, t2, dur, graph.reverb);
      stringSwell(offlineCtx, chord, t2, dur, graph.dry);
      t2 += dur * 0.85;
    }

    return offlineCtx.startRendering().then(audioBufferToWavBlob);
  }

  function audioBufferToWavBlob(buffer){
    var numChannels = buffer.numberOfChannels;
    var sampleRate = buffer.sampleRate;
    var numFrames = buffer.length;
    var bytesPerSample = 2;
    var blockAlign = numChannels * bytesPerSample;
    var dataSize = numFrames * blockAlign;
    var arrayBuffer = new ArrayBuffer(44 + dataSize);
    var view = new DataView(arrayBuffer);

    function writeString(offset, str){
      for (var i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, "WAVE");
    writeString(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeString(36, "data");
    view.setUint32(40, dataSize, true);

    var channels = [];
    for (var ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));

    var offset = 44;
    for (var i = 0; i < numFrames; i++){
      for (var c = 0; c < numChannels; c++){
        var sample = Math.max(-1, Math.min(1, channels[c][i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += 2;
      }
    }

    return new Blob([arrayBuffer], { type: "audio/wav" });
  }

  function triggerDownload(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function wireDownloadButton(buttonId, renderFn, filename, idleLabel){
    var btn = document.getElementById(buttonId);
    if (!btn) return;
    btn.addEventListener("click", function(){
      btn.disabled = true;
      btn.textContent = "Preparando…";
      renderFn(240)
        .then(function(blob){
          triggerDownload(blob, filename);
          btn.textContent = idleLabel;
          btn.disabled = false;
        })
        .catch(function(err){
          console.error(err);
          btn.textContent = "No se pudo generar";
          setTimeout(function(){
            btn.textContent = idleLabel;
            btn.disabled = false;
          }, 2500);
        });
    });
  }

  wireDownloadButton("downloadRain", renderRainWav, "lluvia-relajante.wav", "Descargar lluvia");
  wireDownloadButton("downloadPiano", renderPianoWav, "piano-relajante.wav", "Descargar piano");

  function probeLocalAudio(){
    var urls = [
      "audio/piano.mp3",
      "audio/piano.mp3.mp3",
      "audio/piano.wav",
      "audio/piano.ogg",
      "audio/piano.m4a"
    ];
    return new Promise(function(resolve){
      var i = 0;
      function tryNext(){
        if (i >= urls.length){ resolve(null); return; }
        var url = urls[i++];
        var probe = new Audio();
        var settled = false;
        var timer = setTimeout(function(){
          if (settled) return;
          settled = true;
          tryNext();
        }, 1800);
        probe.addEventListener("loadedmetadata", function(){
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(url);
        });
        probe.addEventListener("error", function(){
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          tryNext();
        });
        probe.src = url;
        probe.load();
      }
      tryNext();
    });
  }

  // Pista de audio desde un archivo (piano y violín). Hace fundido suave al entrar y salir.
  function buildFileTrack(url, level, onError){
    var el = new Audio(url);
    el.loop = true;
    el.preload = "metadata";
    el.playsInline = true;
    el.muted = muted;
    var fadeTimer = null;
    var track = { isFile: true, failed: false, audio: el, level: level };

    function fadeTo(target, ms, done){
      if (fadeTimer) clearInterval(fadeTimer);
      var from = el.volume;
      var steps = Math.max(1, Math.round(ms / 50));
      var i = 0;
      fadeTimer = setInterval(function(){
        i++;
        try { el.volume = Math.max(0, Math.min(1, from + (target - from) * (i / steps))); } catch(e) {}
        if (i >= steps){
          clearInterval(fadeTimer);
          fadeTimer = null;
          if (done) done();
        }
      }, 50);
    }

    el.addEventListener("error", function(){
      track.failed = true;
      if (onError) onError();
    });

    track.start = function(){
      if (el.paused){
        try { el.currentTime = 0; } catch(e) {}
        try { el.volume = 0; } catch(e) {}
      }
      el.muted = muted;
      var p = el.play();
      if (p && p.catch) p.catch(function(err){ if (err && err.name !== "AbortError") console.error("Audio:", err); });
      fadeTo(level, 1400);
    };
    track.stop = function(){ fadeTo(0, 1400, function(){ el.pause(); }); };
    track.setMuted = function(m){ el.muted = m; };
    return track;
  }

  var localPianoProbe = probeLocalAudio();

  var MODE_ORDER = ["rain", "piano", "violin"];
  var MODES = {
    rain:   { label: "🌧️ Lluvia", accent: "var(--accent-rain)",   glow: "rgba(111,175,149,0.20)", shadow: "rgba(111,175,149,0.70)" },
    piano:  { label: "🎹 Piano",  accent: "var(--accent-piano)",  glow: "rgba(205,163,107,0.20)", shadow: "rgba(205,163,107,0.70)" },
    violin: { label: "🎻 Violín", accent: "var(--accent-violin)", glow: "rgba(201,139,147,0.20)", shadow: "rgba(201,139,147,0.70)" }
  };

  function trackFor(m){
    return m === "rain" ? rain : (m === "piano" ? piano : violin);
  }

  // siguiente modo, saltándose el que no tenga su archivo
  function nextMode(){
    var i = MODE_ORDER.indexOf(mode);
    for (var k = 1; k <= MODE_ORDER.length; k++){
      var m = MODE_ORDER[(i + k) % MODE_ORDER.length];
      var tr = trackFor(m);
      if (!(tr && tr.failed)) return m;
    }
    return mode;
  }

  // las pistas basadas en nodos de Web Audio se controlan por ganancia
  function applyLevel(track, on){
    if (!track || track.isFile) return;
    var g = track.gain.gain;
    var t = ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(on ? track.level : 0, t + 1.4);
  }

  function ensureAudio(){
    if (started) return;
    started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    rain = buildRain(ctx, master);
    piano = buildPiano(ctx, master);
    violin = buildFileTrack("audio/violin.mp3", 0.7, function(){
      console.warn("No se encontró audio/violin.mp3");
      if (mode === "violin") setMode("rain");
    });

    rain.gain.gain.setValueAtTime(rain.level, ctx.currentTime);
    piano.gain.gain.setValueAtTime(0, ctx.currentTime);

    localPianoProbe.then(function(url){
      if (!url) {
        console.warn("No se encontró el MP3 del piano en la carpeta audio.");
        return;
      }
      var wasPianoActive = (mode === "piano");
      var oldPiano = piano;
      var filePiano = buildFileTrack(url, 0.7);
      piano = filePiano;
      if (wasPianoActive){
        filePiano.start();
        oldPiano.stop();
        applyLevel(oldPiano, false);
      }
    });
  }

  function crossfadeTo(newMode){
    if (!ctx) return;
    MODE_ORDER.forEach(function(m){
      var tr = trackFor(m);
      if (!tr) return;
      if (m === newMode){
        tr.start();
        applyLevel(tr, true);
      } else {
        tr.stop();
        applyLevel(tr, false);
      }
    });
  }

  function setMode(newMode){
    mode = newMode;
    var cfg = MODES[mode];
    document.body.setAttribute("data-mode", mode);
    var root = document.documentElement.style;
    root.setProperty("--accent", cfg.accent);
    root.setProperty("--accent-glow", cfg.glow);
    root.setProperty("--accent-shadow", cfg.shadow);
    document.getElementById("soundToggle").textContent = cfg.label;
    setTintForMode(mode);
    if (ctx) crossfadeTo(mode);
    bloom();
  }

  document.getElementById("soundToggle").addEventListener("click", function(){
    ensureAudio();
    if (ctx.state === "suspended") ctx.resume();
    setMode(nextMode());
  });

  document.getElementById("muteToggle").addEventListener("click", function(e){
    ensureAudio();
    if (ctx.state === "suspended") ctx.resume();
    muted = !muted;
    var t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, t + 0.4);
    // los audios de archivo no pasan por master: se silencian con .muted (funciona también en iPhone)
    [piano, violin].forEach(function(tr){ if (tr && tr.isFile) tr.setMuted(muted); });
    e.currentTarget.textContent = muted ? "🔇" : "🔊";
  });

  var veil = document.getElementById("startVeil");
  function startFromVeil(){
    ensureAudio();
    if (ctx.state === "suspended") ctx.resume();
    veil.classList.add("hidden");
    setTimeout(function(){ veil.style.display = "none"; }, 650);
  }
  veil.addEventListener("click", startFromVeil);
  veil.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " ") startFromVeil();
  });

})();
</script>
